<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angwa Shanu, Ojepio Sons and Daughters Development Association</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F4EF;
    --card:#FFFFFF;
    --ink:#1F231F;
    --ink-dim:#6B6F66;
    --line:#E4E1D8;
    --green:#3F6B4A;
    --green-dim:#E7EFE8;
    --clay:#B5623A;
    --clay-dim:#F5E4DA;
    --amber:#B98A2E;
    --amber-dim:#F6EBD3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  .app{max-width:1000px; margin:0 auto; padding:32px 24px 80px;}
  h1{font-family:'Fraunces',serif; font-weight:600; font-size:28px; margin:0;}
  .sub{color:var(--ink-dim); font-size:14px; margin:6px 0 28px;}

  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:32px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px;}
  .card .label{font-size:12.5px; color:var(--ink-dim); margin:0 0 6px;}
  .card .value{font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin:0;}

  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:24px; flex-wrap:wrap;}
  .tab{
    padding:10px 16px; border:none; background:none; cursor:pointer;
    font-size:14px; font-weight:500; color:var(--ink-dim);
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tab.active{color:var(--green); border-bottom-color:var(--green);}

  .panel{display:none;}
  .panel.active{display:block;}

  .form-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; align-items:flex-end;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12.5px; color:var(--ink-dim);}
  .field input, .field select{
    padding:9px 10px; border:1px solid var(--line); border-radius:6px;
    font-size:14px; font-family:inherit; min-width:150px; background:#fff; color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--green); outline-offset:1px;}
  button.primary{
    padding:10px 18px; border:none; border-radius:6px; background:var(--green);
    color:#fff; font-size:14px; font-weight:500; cursor:pointer;
  }
  button.primary:hover{background:#345a3d;}
  .error{color:var(--clay); font-size:12.5px; margin-top:4px;}

  table{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  th, td{text-align:left; padding:11px 14px; font-size:14px; border-bottom:1px solid var(--line);}
  th{color:var(--ink-dim); font-weight:500; font-size:12.5px; text-transform:uppercase; letter-spacing:0.02em;}
  tr:last-child td{border-bottom:none;}
  .empty{color:var(--ink-dim); font-size:14px; padding:24px; text-align:center; background:var(--card); border:1px dashed var(--line); border-radius:10px;}
  .tag{display:inline-block; padding:3px 9px; border-radius:20px; font-size:12px; font-weight:500;}
  .tag.green{background:var(--green-dim); color:var(--green);}
  .tag.clay{background:var(--clay-dim); color:var(--clay);}
  .tag.amber{background:var(--amber-dim); color:var(--amber);}
  .del{background:none; border:none; color:var(--ink-dim); cursor:pointer; font-size:13px;}
  .del:hover{color:var(--clay);}
  .status-msg{font-size:13px; color:var(--ink-dim); margin-bottom:16px;}

  .lockscreen{
    max-width:380px; margin:100px auto; padding:32px; background:var(--card);
    border:1px solid var(--line); border-radius:12px; text-align:center;
  }
  .lockscreen h2{font-family:'Fraunces',serif; font-size:20px; margin:0 0 8px;}
  .lockscreen p{color:var(--ink-dim); font-size:13.5px; margin:0 0 20px;}
  .lockscreen input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px;
    font-size:14px; margin-bottom:10px; font-family:inherit;
  }
  .lockscreen button{width:100%; padding:11px; margin-top:4px;}
  .lockscreen .error{text-align:left; margin-top:6px;}
  #appRoot{display:none;}
  .logout-bar{display:flex; justify-content:flex-end; margin-bottom:8px;}
  .logout-bar button{background:none; border:none; color:var(--ink-dim); font-size:13px; cursor:pointer; text-decoration:underline;}
</style>
</head>
<body>

<div id="lockscreen" class="lockscreen">
  <h2 id="lockTitle">Enter password</h2>
  <p id="lockSub">This app is password-protected.</p>
  <input id="lockPass" type="password" placeholder="Password">
  <input id="lockPass2" type="password" placeholder="Confirm password" style="display:none;">
  <button class="primary" onclick="handleLockSubmit()" id="lockBtn">Unlock</button>
  <div id="lockError" class="error"></div>
</div>

<div id="appRoot">
<div class="app">
  <div class="logout-bar"><button onclick="logout()">Lock app</button></div>
  <h1>Angwa Shanu, Ojepio Sons and Daughters Development Association</h1>
  <p class="sub">Ojoku Ojeje, Anpka, Kogi State — members, contributions, launching pledges and donations in one place.</p>

  <div class="cards" id="summaryCards"></div>

  <div class="tabs">
    <button class="tab active" data-tab="members">Members</button>
    <button class="tab" data-tab="contributions">Monthly contributions</button>
    <button class="tab" data-tab="launching">Launching</button>
    <button class="tab" data-tab="donations">Donations</button>
  </div>

  <div id="members" class="panel active">
    <div class="form-row">
      <div class="field">
        <label for="mName">Full name</label>
        <input id="mName" placeholder="Chidinma Eze">
      </div>
      <div class="field">
        <label for="mPhone">Phone (optional)</label>
        <input id="mPhone" placeholder="080...">
      </div>
      <div class="field">
        <label for="mRegFee">Registration fee paid</label>
        <input id="mRegFee" type="number" min="0" placeholder="0">
      </div>
      <button class="primary" onclick="addMember()">Add member</button>
    </div>
    <div id="mError" class="error"></div>
    <div id="membersTable"></div>
  </div>

  <div id="contributions" class="panel">
    <div class="form-row">
      <div class="field">
        <label for="cMember">Member</label>
        <select id="cMember"></select>
      </div>
      <div class="field">
        <label for="cMonth">Month</label>
        <input id="cMonth" type="month">
      </div>
      <div class="field">
        <label for="cAmount">Amount</label>
        <input id="cAmount" type="number" min="0" placeholder="0">
      </div>
      <button class="primary" onclick="addContribution()">Record</button>
    </div>
    <div id="cError" class="error"></div>
    <div id="contributionsTable"></div>
  </div>

  <div id="launching" class="panel">
    <p class="status-msg">Pledges and payments toward the launching / fundraising event.</p>
    <div class="form-row">
      <div class="field">
        <label for="lName">Name</label>
        <input id="lName" placeholder="Donor or member name">
      </div>
      <div class="field">
        <label for="lPledged">Amount pledged</label>
        <input id="lPledged" type="number" min="0" placeholder="0">
      </div>
      <div class="field">
        <label for="lPaid">Amount paid so far</label>
        <input id="lPaid" type="number" min="0" placeholder="0">
      </div>
      <button class="primary" onclick="addLaunching()">Add</button>
    </div>
    <div id="lError" class="error"></div>
    <div id="launchingTable"></div>
  </div>

  <div id="donations" class="panel">
    <div class="form-row">
      <div class="field">
        <label for="dName">Donor name</label>
        <input id="dName" placeholder="Name">
      </div>
      <div class="field">
        <label for="dAmount">Amount</label>
        <input id="dAmount" type="number" min="0" placeholder="0">
      </div>
      <div class="field">
        <label for="dPurpose">Purpose (optional)</label>
        <input id="dPurpose" placeholder="e.g. building fund">
      </div>
      <div class="field">
        <label for="dDate">Date</label>
        <input id="dDate" type="date">
      </div>
      <button class="primary" onclick="addDonation()">Record</button>
    </div>
    <div id="dError" class="error"></div>
    <div id="donationsTable"></div>
  </div>
</div>
</div>

<script>
let data = { members: [], contributions: [], launching: [], donations: [] };
let loaded = false;

async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function initLock(){
  let rec = null;
  try{
    const res = await window.storage.get('association-auth', true);
    if(res && res.value) rec = JSON.parse(res.value);
  }catch(e){}

  const isSetup = !rec;
  const title = document.getElementById('lockTitle');
  const sub = document.getElementById('lockSub');
  const pass2 = document.getElementById('lockPass2');
  const btn = document.getElementById('lockBtn');

  if(isSetup){
    title.textContent = 'Set an admin password';
    sub.textContent = 'This is the first time opening this app — choose a password everyone with access will use.';
    pass2.style.display = 'block';
    btn.textContent = 'Set password';
  }

  btn.onclick = () => handleLockSubmit(isSetup);
  document.getElementById('lockPass').addEventListener('keydown', e=>{ if(e.key==='Enter' && !isSetup) handleLockSubmit(isSetup); });
}

async function handleLockSubmit(isSetup){
  const err = document.getElementById('lockError');
  const pass = document.getElementById('lockPass').value;
  err.textContent = '';
  if(!pass){ err.textContent = 'Enter a password'; return; }

  if(isSetup){
    const pass2 = document.getElementById('lockPass2').value;
    if(pass.length < 4){ err.textContent = 'Use at least 4 characters'; return; }
    if(pass !== pass2){ err.textContent = 'Passwords do not match'; return; }
    const hash = await sha256(pass);
    await window.storage.set('association-auth', JSON.stringify({ hash }), true);
    unlockApp();
  } else {
    let rec = null;
    try{
      const res = await window.storage.get('association-auth', true);
      if(res && res.value) rec = JSON.parse(res.value);
    }catch(e){}
    const hash = await sha256(pass);
    if(rec && rec.hash === hash){
      unlockApp();
    } else {
      err.textContent = 'Incorrect password';
    }
  }
}

function unlockApp(){
  document.getElementById('lockscreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  sessionStorageFlag(true);
  if(!loaded) loadData();
}

function logout(){
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('lockscreen').style.display = 'block';
  document.getElementById('lockPass').value = '';
  sessionStorageFlag(false);
}

let unlockedThisSession = false;
function sessionStorageFlag(val){ unlockedThisSession = val; }

async function loadData(){
  try{
    const res = await window.storage.get('association-data', true);
    if(res && res.value){ data = JSON.parse(res.value); }
  }catch(e){}
  loaded = true;
  renderAll();
}

async function saveData(){
  try{
    await window.storage.set('association-data', JSON.stringify(data), true);
  }catch(e){ console.error('Save failed', e); }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function money(n){ return '₦' + Number(n||0).toLocaleString(); }

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id===name));
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>switchTab(t.dataset.tab)));

function addMember(){
  const name = document.getElementById('mName').value.trim();
  const phone = document.getElementById('mPhone').value.trim();
  const fee = document.getElementById('mRegFee').value;
  const err = document.getElementById('mError');
  if(!name){ err.textContent = 'Enter a name first'; return; }
  err.textContent = '';
  data.members.push({ id: uid(), name, phone, regFee: Number(fee)||0 });
  document.getElementById('mName').value='';
  document.getElementById('mPhone').value='';
  document.getElementById('mRegFee').value='';
  saveData(); renderAll();
}

function removeMember(id){
  data.members = data.members.filter(m=>m.id!==id);
  data.contributions = data.contributions.filter(c=>c.memberId!==id);
  saveData(); renderAll();
}

function addContribution(){
  const memberId = document.getElementById('cMember').value;
  const month = document.getElementById('cMonth').value;
  const amount = document.getElementById('cAmount').value;
  const err = document.getElementById('cError');
  if(!memberId){ err.textContent = 'Add a member first'; return; }
  if(!month){ err.textContent = 'Choose a month'; return; }
  if(!amount || Number(amount)<=0){ err.textContent = 'Enter an amount'; return; }
  err.textContent = '';
  data.contributions.push({ id: uid(), memberId, month, amount: Number(amount) });
  document.getElementById('cAmount').value='';
  saveData(); renderAll();
}

function removeContribution(id){
  data.contributions = data.contributions.filter(c=>c.id!==id);
  saveData(); renderAll();
}

function addLaunching(){
  const name = document.getElementById('lName').value.trim();
  const pledged = document.getElementById('lPledged').value;
  const paid = document.getElementById('lPaid').value;
  const err = document.getElementById('lError');
  if(!name){ err.textContent = 'Enter a name first'; return; }
  err.textContent = '';
  data.launching.push({ id: uid(), name, pledged: Number(pledged)||0, paid: Number(paid)||0 });
  document.getElementById('lName').value='';
  document.getElementById('lPledged').value='';
  document.getElementById('lPaid').value='';
  saveData(); renderAll();
}

function removeLaunching(id){
  data.launching = data.launching.filter(l=>l.id!==id);
  saveData(); renderAll();
}

function addDonation(){
  const name = document.getElementById('dName').value.trim();
  const amount = document.getElementById('dAmount').value;
  const purpose = document.getElementById('dPurpose').value.trim();
  const dateVal = document.getElementById('dDate').value;
  const err = document.getElementById('dError');
  if(!name){ err.textContent = 'Enter a donor name'; return; }
  if(!amount || Number(amount)<=0){ err.textContent = 'Enter an amount'; return; }
  err.textContent = '';
  data.donations.push({ id: uid(), name, amount: Number(amount), purpose, date: dateVal || new Date().toISOString().slice(0,10) });
  document.getElementById('dName').value='';
  document.getElementById('dAmount').value='';
  document.getElementById('dPurpose').value='';
  document.getElementById('dDate').value='';
  saveData(); renderAll();
}

function removeDonation(id){
  data.donations = data.donations.filter(d=>d.id!==id);
  saveData(); renderAll();
}

function memberName(id){
  const m = data.members.find(x=>x.id===id);
  return m ? m.name : 'Unknown';
}

function renderMembers(){
  const el = document.getElementById('membersTable');
  const sel = document.getElementById('cMember');
  sel.innerHTML = '<option value="">Select member</option>' +
    data.members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');

  if(data.members.length===0){
    el.innerHTML = '<div class="empty">No members yet. Add your first member above.</div>';
    return;
  }
  el.innerHTML = `<table><thead><tr><th>Name</th><th>Phone</th><th>Registration fee</th><th>Total contributed</th><th></th></tr></thead><tbody>` +
    data.members.map(m=>{
      const total = data.contributions.filter(c=>c.memberId===m.id).reduce((s,c)=>s+c.amount,0);
      return `<tr><td>${m.name}</td><td>${m.phone||'—'}</td><td>${money(m.regFee)}</td><td>${money(total)}</td><td><button class="del" onclick="removeMember('${m.id}')">Remove</button></td></tr>`;
    }).join('') + `</tbody></table>`;
}

function renderContributions(){
  const el = document.getElementById('contributionsTable');
  if(data.contributions.length===0){
    el.innerHTML = '<div class="empty">No contributions recorded yet.</div>';
    return;
  }
  const rows = [...data.contributions].sort((a,b)=> b.month.localeCompare(a.month));
  el.innerHTML = `<table><thead><tr><th>Member</th><th>Month</th><th>Amount</th><th></th></tr></thead><tbody>` +
    rows.map(c=>`<tr><td>${memberName(c.memberId)}</td><td>${c.month}</td><td>${money(c.amount)}</td><td><button class="del" onclick="removeContribution('${c.id}')">Remove</button></td></tr>`).join('') +
    `</tbody></table>`;
}

function renderLaunching(){
  const el = document.getElementById('launchingTable');
  if(data.launching.length===0){
    el.innerHTML = '<div class="empty">No launching pledges recorded yet.</div>';
    return;
  }
  el.innerHTML = `<table><thead><tr><th>Name</th><th>Pledged</th><th>Paid</th><th>Status</th><th></th></tr></thead><tbody>` +
    data.launching.map(l=>{
      const status = l.paid >= l.pledged && l.pledged>0
        ? '<span class="tag green">Fulfilled</span>'
        : l.paid > 0 ? '<span class="tag amber">Partial</span>' : '<span class="tag clay">Pending</span>';
      return `<tr><td>${l.name}</td><td>${money(l.pledged)}</td><td>${money(l.paid)}</td><td>${status}</td><td><button class="del" onclick="removeLaunching('${l.id}')">Remove</button></td></tr>`;
    }).join('') + `</tbody></table>`;
}

function renderDonations(){
  const el = document.getElementById('donationsTable');
  if(data.donations.length===0){
    el.innerHTML = '<div class="empty">No donations recorded yet.</div>';
    return;
  }
  const rows = [...data.donations].sort((a,b)=> b.date.localeCompare(a.date));
  el.innerHTML = `<table><thead><tr><th>Donor</th><th>Amount</th><th>Purpose</th><th>Date</th><th></th></tr></thead><tbody>` +
    rows.map(d=>`<tr><td>${d.name}</td><td>${money(d.amount)}</td><td>${d.purpose||'—'}</td><td>${d.date}</td><td><button class="del" onclick="removeDonation('${d.id}')">Remove</button></td></tr>`).join('') +
    `</tbody></table>`;
}

function renderSummary(){
  const totalMembers = data.members.length;
  const totalContrib = data.contributions.reduce((s,c)=>s+c.amount,0);
  const totalLaunching = data.launching.reduce((s,l)=>s+l.paid,0);
  const totalDonations = data.donations.reduce((s,d)=>s+d.amount,0);
  const totalRegFees = data.members.reduce((s,m)=>s+m.regFee,0);
  const cards = [
    ['Members', totalMembers],
    ['Registration fees', money(totalRegFees)],
    ['Monthly contributions', money(totalContrib)],
    ['Launching raised', money(totalLaunching)],
    ['Donations', money(totalDonations)],
  ];
  document.getElementById('summaryCards').innerHTML = cards.map(([label,value])=>
    `<div class="card"><p class="label">${label}</p><p class="value">${value}</p></div>`
  ).join('');
}

function renderAll(){
  renderSummary();
  renderMembers();
  renderContributions();
  renderLaunching();
  renderDonations();
}

initLock();
</script>
</body>
</html>
